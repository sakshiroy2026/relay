[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "relay"
version = "0.1.0"
description = "A durable execution runtime for AI agents"
requires-python = ">=3.13"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary,pool]",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "structlog",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "httpx",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.13"

[tool.setuptools.packages.find]
include = ["relay*"]